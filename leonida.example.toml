# Copy to `leonida.toml` (git-ignored) and point it at YOUR files.
# Every path must be OUTSIDE the repository; the tools refuse otherwise.
# Environment variables (shown below) take precedence over this file.
# LEONIDA_CONFIG selects a different config file.

[paths]
# Your own dump of the title.     env: LEONIDA_GAME_DIR
# Left unset, `leonida run` asks for it once and writes it here.
# game_dir = 'D:\leonida-data\game'

# Derived data. Default: %LOCALAPPDATA%\leonida\cache.   env: LEONIDA_CACHE_DIR
# cache_dir = 'D:\leonida-data\cache'

# What titles save (persistent local storage), kept apart from the cache.
# Default: %LOCALAPPDATA%\leonida\data.   env: LEONIDA_DATA_DIR
# data_dir = 'D:\leonida-data\data'

# Other Xbox Series titles used to test platform-level code.
# env: LEONIDA_TEST_TITLES (separated by ';')
test_titles = []

# The executable selects the measured profiles automatically, including in Wine.
# Precedence: explicit environment > these settings > selected profiles.
# See the effective values with `leonida config --graphics` (no game needed).
[graphics]
# Omit profiles for automatic selection. [] or ["none"] disables profiles;
# individual settings below still apply. Named profiles also include base.
# profiles = ["base"]

# Leave a setting commented to use its profile value. false explicitly turns it off.
# async_submit = true          # LEONIDA_ASYNC_SUBMIT
# async_present = true         # LEONIDA_ASYNC_PRESENT
# queue2 = 1                   # LEONIDA_QUEUE2: 0..3, copy-queue bit mask
# indirect_window = true       # LEONIDA_INDIRECT_WINDOW
# copy_plain = true            # LEONIDA_COPY_PLAIN
# join_parts = true            # LEONIDA_JOIN_PARTS
# back_own_view = true         # LEONIDA_BACK_OWN_VIEW
# indirect_gather = true       # LEONIDA_INDIRECT_GATHER
# card_rehash_runs = true      # LEONIDA_CARD_REHASH_RUNS

# These experimental settings are NOT enabled automatically.
# card_windows_mb = 0          # LEONIDA_CARD_WINDOWS_MB: limit in MiB, 0 disables
# window_upload = false        # LEONIDA_WINDOW_UPLOAD
# texture_room_percent = 90    # LEONIDA_TEXTURE_ROOM_PERCENT: 50..97
# texture_stage_mb = 512       # LEONIDA_TEXTURE_STAGE_MB: MiB of textures staged a frame, 64..4096
